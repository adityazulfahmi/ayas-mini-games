<style>
.a{transform-box:fill-box;transform-origin:center}
.hop{animation:hop 2.8s cubic-bezier(.3,0,.4,1) infinite}
.sh{animation:sh 2.8s cubic-bezier(.3,0,.4,1) infinite}
.d1{animation-delay:.35s}.d2{animation-delay:.7s}.d3{animation-delay:1.05s}
.pulse{animation:pulse 2.8s ease-in-out 1.4s infinite}
.halo{animation:halo 2.8s ease-in-out 1.4s infinite}
.q{animation:q 2.8s ease-in-out 1.4s infinite}
.tw{animation:tw 2.4s ease-in-out infinite}
.t1{animation-delay:.8s}.t2{animation-delay:1.5s}
.dot{animation:dot 2.8s ease-in-out infinite}
@keyframes hop{0%,30%,100%{transform:translateY(0) rotate(0)}12%{transform:translateY(-20px) rotate(-6deg)}22%{transform:translateY(2px) rotate(2deg)}}
@keyframes sh{0%,30%,100%{transform:scale(1);opacity:.35}12%{transform:scale(.7);opacity:.2}}
@keyframes pulse{0%,35%,100%{transform:scale(1)}15%{transform:scale(1.1)}}
@keyframes halo{0%,40%,100%{transform:scale(1);opacity:.9}15%{transform:scale(1.15);opacity:1}}
@keyframes q{0%,40%,100%{transform:rotate(0)}12%{transform:rotate(-9deg)}24%{transform:rotate(7deg)}}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.35}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
