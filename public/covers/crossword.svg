<g class="a cl" fill="#fff" opacity=".55"><circle cx="322" cy="262" r="15"/><circle cx="344" cy="253" r="20"/><circle cx="366" cy="264" r="14"/><rect x="308" y="261" width="72" height="17" rx="8.5"/></g>
<g class="a cl" fill="#fff"><circle cx="-5" cy="440" r="55"/><circle cx="70" cy="455" r="60"/><circle cx="150" cy="470" r="52"/><circle cx="250" cy="472" r="56"/><circle cx="335" cy="455" r="62"/><circle cx="410" cy="435" r="50"/></g>
