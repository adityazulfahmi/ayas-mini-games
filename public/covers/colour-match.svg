<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7d1"/><stop offset=".6" stop-color="#ffe793"/><stop offset="1" stop-color="#ffd15c"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffdf0"/><stop offset=".7" stop-color="#fffbe2" stop-opacity=".75"/><stop offset="1" stop-color="#fffbe2" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".08"/></linearGradient>
<linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc64a"/><stop offset="1" stop-color="#ffab2e"/></linearGradient>
<linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb8"/><stop offset="1" stop-color="#f0437f"/></linearGradient>
<linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a70"/><stop offset="1" stop-color="#e53935"/></linearGradient>
<linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb74d"/><stop offset="1" stop-color="#fb8c00"/></linearGradient>
<linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ed882"/><stop offset="1" stop-color="#43a047"/></linearGradient>
<linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64b9ff"/><stop offset="1" stop-color="#1e88e5"/></linearGradient>
<linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c56fe0"/><stop offset="1" stop-color="#8e24aa"/></linearGradient>
<linearGradient id="g-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa3cb"/><stop offset="1" stop-color="#ff6fae"/></linearGradient>
<clipPath id="clip"><rect width="400" height="460"/></clipPath>
</defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.hl{transform-box:fill-box;transform-origin:50% 100%;animation:bumpL 3.2s ease-in-out infinite}
.hr{transform-box:fill-box;transform-origin:50% 100%;animation:bumpR 3.2s ease-in-out infinite}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 3.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.8s ease-in-out infinite}
.b2{animation-delay:-.5s}.b3{animation-delay:-1s}.b4{animation-delay:-1.5s}.b5{animation-delay:-2s}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
.k2{animation-delay:-1.3s}.k3{animation-delay:-2.6s}.k4{animation-delay:-3.4s}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.t2{animation-delay:-.9s}.t3{animation-delay:-1.7s}
.mini{transform-box:fill-box;transform-origin:center;animation:mini 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bumpL{0%,100%{transform:translate(0,0) rotate(0)}40%{transform:translate(-7px,-5px) rotate(-5deg)}55%{transform:translate(2px,0) rotate(2deg)}70%{transform:translate(0,0) rotate(0)}}
@keyframes bumpR{0%,100%{transform:translate(0,0) rotate(0)}40%{transform:translate(7px,-5px) rotate(5deg)}55%{transform:translate(-2px,0) rotate(-2deg)}70%{transform:translate(0,0) rotate(0)}}
@keyframes beat{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(3px) scale(.9)}58%{transform:translateY(-6px) scale(1.16)}75%{transform:translateY(-2px) scale(1)}}
@keyframes mini{0%,50%,100%{opacity:.95;transform:translateY(0) scale(1)}62%{transform:translateY(-5px) scale(1.25)}}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-6px) scaleY(1.03)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
