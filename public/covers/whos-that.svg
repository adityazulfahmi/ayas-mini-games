<ellipse cx="234" cy="373" rx="29" ry="15"/>
<ellipse cx="200" cy="222" rx="70" ry="58"/>
</clipPath>
<clipPath id="half"><rect x="-300" y="0" width="500" height="460"/></clipPath>
<path id="star" d="M0-10Q1.6-1.6 10 0Q1.6 1.6 0 10Q-1.6 1.6-10 0Q-1.6-1.6 0-10Z"/>
<g id="curtain">
<path d="M-40 0H106C102 92 94 172 58 238C72 300 78 362 73 420Q36 432 0 420H-40Z" fill="url(#curt)"/>
