<radialGradient id="glow" cx="200" cy="235" r="185" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe9a6"/><stop offset=".45" stop-color="#ffc24d" stop-opacity=".85"/><stop offset=".8" stop-color="#f0629a" stop-opacity=".3"/><stop offset="1" stop-color="#f0629a" stop-opacity="0"/></radialGradient>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdf8a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd76a" stop-opacity=".1"/></linearGradient>
<linearGradient id="curt" x1="0" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect"><stop offset="0" stop-color="#9c1250"/><stop offset=".55" stop-color="#d42a70"/><stop offset="1" stop-color="#f0629a"/></linearGradient>
<linearGradient id="curtShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0638" stop-opacity=".55"/><stop offset=".35" stop-color="#3a0638" stop-opacity="0"/><stop offset="1" stop-color="#3a0638" stop-opacity=".35"/></linearGradient>
<linearGradient id="val" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a0c44"/><stop offset="1" stop-color="#c81f68"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a2360"/><stop offset="1" stop-color="#3a0d3c"/></linearGradient>
<radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe08a" stop-opacity=".85"/><stop offset="1" stop-color="#ffc24d" stop-opacity="0"/></radialGradient>
<radialGradient id="fur" cx="185" cy="200" r="210" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffdf8"/><stop offset=".6" stop-color="#fff1e2"/><stop offset="1" stop-color="#f1cfc4"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fffbe0"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></linearGradient>
<g id="shape">
