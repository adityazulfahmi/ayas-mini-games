<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 460">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f86ee"/><stop offset=".5" stop-color="#86bdfb"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9cc0"/><stop offset="1" stop-color="#ee4f88"/></linearGradient>
<linearGradient id="yl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#ffc21f"/></linearGradient>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbe5c"/><stop offset="1" stop-color="#ff9433"/></linearGradient>
<g id="tp"><rect x="4" y="15" width="72" height="76" rx="18" fill="#3b2a8c" opacity=".16"/><rect y="9" width="78" height="78" rx="18" fill="#b91c63"/><rect width="78" height="78" rx="18" fill="url(#pk)"/><rect x="6" y="5" width="66" height="27" rx="13" fill="#fff" opacity=".28"/><circle cx="16" cy="15" r="4.5" fill="#fff" opacity=".8"/></g>
<g id="ty"><rect x="4" y="15" width="72" height="76" rx="18" fill="#3b2a8c" opacity=".16"/><rect y="9" width="78" height="78" rx="18" fill="#e08a00"/><rect width="78" height="78" rx="18" fill="url(#yl)"/><rect x="6" y="5" width="66" height="27" rx="13" fill="#fff" opacity=".45"/><circle cx="16" cy="15" r="4.5" fill="#fff" opacity=".9"/></g>
<path id="lc" d="M53 28a17 17 0 1 0 0 23"/>
<path id="la" d="M24 59L39 21 54 59M30 47H48"/>
<path id="lt" d="M22 23H56M39 23V59"/>
<path id="ly" d="M23 21L39 40 55 21M39 40V59"/>
<path id="sp" d="M0-12Q0 0 12 0 0 0 0 12 0 0-12 0 0 0 0-12Z"/>
<g id="paw"><ellipse cx="0" cy="3" rx="18" ry="11" fill="#7a2a50" opacity=".22"/><ellipse rx="18" ry="12" fill="url(#fur)"/><path d="M-6 3v7M6 3v7" stroke="#e0701a" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="-3" cy="-5" rx="9" ry="3" fill="#fff" opacity=".35"/></g>
</defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
.hop{animation:hop 4.2s cubic-bezier(.3,.6,.4,1) infinite}
.h2{animation-delay:.16s}.h3{animation-delay:.32s}.h4{animation-delay:.48s}.h5{animation-delay:.64s}
@keyframes hop{0%,70%,100%{transform:translateY(0) scale(1)}76%{transform:translateY(-12px) scale(.97,1.04)}84%{transform:translateY(0) scale(1.04,.95)}90%{transform:translateY(-3px) scale(1)}95%{transform:translateY(0) scale(1)}}
.head{transform-origin:50% 100%;animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
.eye{animation:blink 4.6s infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.tail{transform-origin:85% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}
.tw{animation:tw 2.8s ease-in-out infinite}.t2{animation-delay:.9s}.t3{animation-delay:1.7s}.t4{animation-delay:.4s}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(25deg);opacity:.55}}
.cl{animation:drift 9s ease-in-out infinite}.c2{animation-duration:12s;animation-direction:reverse}
@keyframes drift{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="460" fill="url(#bg)"/>
