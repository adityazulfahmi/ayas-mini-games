<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 460">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
<stop offset="0" stop-color="#ff7fb8"/><stop offset=".38" stop-color="#f9a3d6"/><stop offset=".7" stop-color="#93dcec"/><stop offset="1" stop-color="#2fcfc6"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="bf" cx=".42" cy=".4" r=".6">
<stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".7" stop-color="#fff" stop-opacity=".14"/><stop offset=".9" stop-color="#e9fbff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/>
</radialGradient>
<linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffd3ec"/><stop offset=".55" stop-color="#fff6b8"/><stop offset=".78" stop-color="#a8f5ee"/><stop offset="1" stop-color="#d9c2ff"/>
</linearGradient>
<linearGradient id="berry" x1="0" y1="0" x2=".6" y2="1">
<stop offset="0" stop-color="#ff6f7f"/><stop offset="1" stop-color="#e3204e"/>
</linearGradient>
<linearGradient id="carg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffab2e"/>
</linearGradient>
<linearGradient id="suds" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#c9f6f2" stop-opacity=".9"/>
</linearGradient>
<g id="bub">
<circle r="100" fill="url(#bf)"/>
<circle r="97.5" fill="none" stroke="url(#iri)" stroke-width="5"/>
<path d="M-74,-36 A82,82 0 0 1 -32,-76" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".95"/>
<circle cx="-80" cy="-10" r="5.5" fill="#fff" opacity=".95"/>
<path d="M36,78 A86,86 0 0 0 78,36" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
</g>
<path id="sp" d="M0,-10 C1.5,-3 3,-1.5 10,0 C3,1.5 1.5,3 0,10 C-1.5,3 -3,-1.5 -10,0 C-3,-1.5 -1.5,-3 0,-10Z"/>
<path id="leaf" d="M0,2 C-10,-6 -10,-22 0,-31 C10,-22 10,-6 0,2Z"/>
</defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
.b1{animation:bob 5s ease-in-out infinite}
.b2{animation:bob 4.2s ease-in-out -1.3s infinite}
.b3{animation:bob 4.6s ease-in-out -2.6s infinite}
.b4{animation:bob 3.8s ease-in-out -.8s infinite}
.pop{animation:pop 2.4s ease-in-out infinite}
.tw{animation:tw 2.2s ease-in-out infinite}
.tw2{animation:tw 2.8s ease-in-out -1.1s infinite}
.star{animation:star 2.4s ease-in-out infinite}
.eye{animation:blink 4.5s infinite}
.wig{animation:wig 5s ease-in-out infinite}
.rise{animation:rise 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(1.13) rotate(8deg);opacity:.8}}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
@keyframes star{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(.78) rotate(-10deg)}}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="460" fill="url(#sky)"/>
<circle cx="150" cy="270" r="210" fill="url(#glow)"/>
<circle cx="350" cy="40" r="120" fill="#fff" opacity=".1"/>
<circle cx="20" cy="400" r="130" fill="#fff" opacity=".1"/>
<!-- suds -->
<g fill="#fff" opacity=".35">
<circle cx="40" cy="440" r="52"/><circle cx="130" cy="455" r="46"/><circle cx="215" cy="448" r="50"/><circle cx="300" cy="458" r="48"/><circle cx="380" cy="440" r="50"/>
</g>
<g fill="url(#suds)">
<circle cx="5" cy="462" r="44"/><circle cx="70" cy="470" r="40"/><circle cx="140" cy="478" r="42"/><circle cx="205" cy="472" r="38"/><circle cx="265" cy="480" r="42"/><circle cx="335" cy="476" r="40"/><circle cx="400" cy="466" r="42"/>
</g>
<!-- tiny free bubbles -->
<g class="a rise">
<g transform="translate(42,235) scale(.14)"><use xlink:href="#bub"/></g>
<g transform="translate(352,330) scale(.12)"><use xlink:href="#bub"/></g>
<g transform="translate(212,60) scale(.1)"><use xlink:href="#bub"/></g>
</g>
<g class="a rise" style="animation-delay:-3s">
<g transform="translate(28,330) scale(.09)"><use xlink:href="#bub"/></g>
<g transform="translate(370,205) scale(.16)"><use xlink:href="#bub"/></g>
<g transform="translate(215,150) scale(.07)"><use xlink:href="#bub"/></g>
</g>
<!-- bunny bubble -->
<g transform="translate(122,108)"><g class="b2">
<g transform="translate(5,6) scale(.88)"><g class="a wig">
<g transform="rotate(-12 -13 -8)"><ellipse cx="-13" cy="-30" rx="10" ry="25" fill="#fff"/><ellipse cx="-13" cy="-29" rx="4.5" ry="17" fill="#f47aa8"/></g>
<g transform="rotate(14 13 -8)"><ellipse cx="13" cy="-30" rx="10" ry="25" fill="#fff"/><ellipse cx="13" cy="-29" rx="4.5" ry="17" fill="#f47aa8"/></g>
<ellipse cx="0" cy="16" rx="31" ry="27" fill="#fff"/>
<path d="M-27,26 A31,27 0 0 0 27,26 A34,30 0 0 1 -27,26Z" fill="#ead9f7"/>
<circle cx="-11" cy="12" r="4" fill="#4a1456"/><circle cx="11" cy="12" r="4" fill="#4a1456"/>
<circle cx="-12.3" cy="10.6" r="1.3" fill="#fff"/><circle cx="9.7" cy="10.6" r="1.3" fill="#fff"/>
<ellipse cx="0" cy="19" rx="3.2" ry="2.3" fill="#f06292"/>
<path d="M-6,24 Q-3,27.5 0,24 Q3,27.5 6,24" fill="none" stroke="#4a1456" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="-20" cy="21" rx="5.5" ry="3.5" fill="#ffb3d1"/><ellipse cx="20" cy="21" rx="5.5" ry="3.5" fill="#ffb3d1"/>
</g></g>
<g transform="scale(.62)"><use xlink:href="#bub"/></g>
</g></g>
<!-- car bubble -->
<g transform="translate(314,252)"><g class="b3">
<g transform="translate(0,2) rotate(-6)">
<path d="M-37,6 Q-37,-6 -26,-7 L-18,-21 Q-15,-27 -8,-27 H10 Q17,-27 20,-21 L27,-7 Q37,-6 37,6 V13 Q37,18 32,18 H-32 Q-37,18 -37,13Z" fill="url(#carg)"/>
<path d="M-17,-7 L-11,-18 Q-10,-20.500 -7,-20.500 H-1 V-7Z M4,-7 V-20.500 H9 Q12,-20.500 13.500,-18 L19,-7Z" fill="#dffaff"/>
<path d="M-37,8 H37" stroke="#ff8a1f" stroke-width="3" opacity=".6"/>
<circle cx="31" cy="1" r="3.500" fill="#fff8d6"/>
<circle cx="-19" cy="18" r="10.500" fill="#4a1456"/><circle cx="-19" cy="18" r="4.500" fill="#e7c9f5"/>
<circle cx="20" cy="18" r="10.500" fill="#4a1456"/><circle cx="20" cy="18" r="4.500" fill="#e7c9f5"/>
</g>
<g transform="scale(.58)"><use xlink:href="#bub"/></g>
</g></g>
<!-- music note bubble -->
<g transform="translate(258,392)"><g class="b4">
<g fill="#6a1b9a" transform="rotate(-8)">
<ellipse cx="-5" cy="10" rx="8" ry="6" transform="rotate(-20 -5 10)"/>
<path d="M0.500,10 V-15 Q10,-13 12,-3 Q7,-8 3.500,-8 V10Z"/>
</g>
<g transform="scale(.33)"><use xlink:href="#bub"/></g>
</g></g>
<!-- hero strawberry bubble -->
<g transform="translate(150,278)"><g class="b1">
<g transform="translate(0,8) scale(1.08)">
<path d="M0,58 C-30,46 -53,12 -49,-17 C-46,-40 -22,-46 0,-38 C22,-46 46,-40 49,-17 C53,12 30,46 0,58Z" fill="url(#berry)"/>
<path d="M-38,-22 C-36,-32 -28,-36 -19,-35" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
<g fill="#ffe680">
<ellipse cx="-30" cy="-4" rx="2.200" ry="3.400"/><ellipse cx="30" cy="-6" rx="2.200" ry="3.400"/><ellipse cx="0" cy="-16" rx="2.200" ry="3.400"/><ellipse cx="-24" cy="22" rx="2.200" ry="3.400"/><ellipse cx="24" cy="22" rx="2.200" ry="3.400"/><ellipse cx="0" cy="38" rx="2.200" ry="3.400"/><ellipse cx="34" cy="-22" rx="2.200" ry="3.400"/><ellipse cx="-12" cy="44" rx="2.200" ry="3.400"/><ellipse cx="13" cy="42" rx="2.200" ry="3.400"/>
</g>
<g fill="#3fbf5f" transform="translate(0,-36)">
<use xlink:href="#leaf" transform="rotate(-118) scale(1.05)"/><use xlink:href="#leaf" transform="rotate(118) scale(1.05)"/>
<use xlink:href="#leaf" transform="rotate(-62)"/><use xlink:href="#leaf" transform="rotate(62)"/>
<path d="M-3.500,2 Q-4,-12 2,-19 L8,-16 Q4,-10 4,2Z" fill="#2e9e4c"/>
<circle r="7" fill="#3fbf5f"/>
</g>
<g class="a eye"><circle cx="-16" cy="4" r="5.500" fill="#4a1030"/><circle cx="16" cy="4" r="5.500" fill="#4a1030"/><circle cx="-17.800" cy="2" r="1.900" fill="#fff"/><circle cx="14.200" cy="2" r="1.900" fill="#fff"/></g>
<path d="M-7,12 Q0,21 7,12" fill="#7a1238" stroke="#7a1238" stroke-width="2.500" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="-28" cy="13" rx="7" ry="4.500" fill="#ffa0b4" opacity=".9"/><ellipse cx="28" cy="13" rx="7" ry="4.500" fill="#ffa0b4" opacity=".9"/>
</g>
<use xlink:href="#bub"/>
</g></g>
<!-- pop burst -->
<g transform="translate(296,98)">
<circle r="44" fill="#fff" opacity=".2"/>
<g class="a pop">
<circle r="41" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="20 22.930" transform="rotate(12)"/>
<g stroke-linecap="round" stroke-width="5.5" stroke="#fff">
<path d="M0,-54 V-66 M0,54 V64 M-54,0 H-64 M54,0 H66"/>
<path d="M39,-39 L46,-46 M-39,39 L-46,46 M39,39 L47,47 M-39,-39 L-47,-47" opacity=".85"/>
</g>
<circle cx="26" cy="-60" r="4.500" fill="#a8f5ee"/><circle cx="-60" cy="-24" r="4" fill="#fff"/><circle cx="60" cy="27" r="4" fill="#fff6b8"/><circle cx="-24" cy="60" r="4.500" fill="#fff"/>
</g>
<g class="a star"><use xlink:href="#sp" transform="scale(3.5)" fill="#ffe94a"/><use xlink:href="#sp" transform="scale(2.3)" fill="#fff"/></g>
</g>
<!-- sparkles -->
<g transform="translate(232,205)"><use class="a tw2" xlink:href="#sp" fill="#fff"/></g>
<g transform="translate(44,165) scale(1.3)"><use class="a tw" xlink:href="#sp" fill="#fff"/></g>
<g transform="translate(205,22) scale(.9)"><use class="a tw2" xlink:href="#sp" fill="#fff"/></g>
<g transform="translate(372,300) scale(.9)"><use class="a tw" xlink:href="#sp" fill="#fff"/></g>
<g transform="translate(60,395) scale(1.1)"><use class="a tw2" xlink:href="#sp" fill="#fff"/></g>
</svg>
