<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 460">
<defs>
<radialGradient id="bg" cx="50%" cy="34%" r="85%">
<stop offset="0" stop-color="#feffdc"/><stop offset=".45" stop-color="#e6f77c"/><stop offset="1" stop-color="#a3db4a"/>
</radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93d342"/><stop offset="1" stop-color="#6cbb33"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8b7c"/><stop offset="1" stop-color="#ee4a47"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78c0ff"/><stop offset="1" stop-color="#3a86f0"/></linearGradient>
<linearGradient id="rimR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc4ba"/><stop offset="1" stop-color="#ff9a8e"/></linearGradient>
<linearGradient id="rimB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4e3ff"/><stop offset="1" stop-color="#8fc8ff"/></linearGradient>
<path id="star" d="M0,-50 L15.3,-21 L47.6,-15.5 L24.7,8 L29.4,40.5 L0,26 L-29.4,40.5 L-24.7,8 L-47.6,-15.5 L-15.3,-21Z"/>
<path id="heart" d="M0,28 C-44,2 -36,-30 -15,-30 C-5,-30 0,-23 0,-18 C0,-23 5,-30 15,-30 C36,-30 44,2 0,28Z"/>
<path id="body" d="M-66,0 L66,0 L57,88 Q55,106 37,106 L-37,106 Q-55,106 -57,88Z"/>
<path id="splash" d="M0,-17 C6,-23 15,-19 14,-11 C22,-12 25,-2 18,2 C24,9 17,18 9,14 C7,22 -5,22 -7,14 C-15,19 -23,11 -17,4 C-25,0 -22,-11 -13,-10 C-14,-18 -5,-22 0,-17Z"/>
<g id="face">
<g class="blink"><circle cx="-11" cy="-2" r="4.3" fill="#3b2140"/><circle cx="11" cy="-2" r="4.3" fill="#3b2140"/><circle cx="-9.6" cy="-3.6" r="1.4" fill="#fff"/><circle cx="12.4" cy="-3.6" r="1.4" fill="#fff"/></g>
<path d="M-6.5,6.5 Q0,13.5 6.5,6.5" fill="none" stroke="#3b2140" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-19.5" cy="7" rx="5" ry="3.2" fill="#ff5d8f" opacity=".45"/><ellipse cx="19.5" cy="7" rx="5" ry="3.2" fill="#ff5d8f" opacity=".45"/>
</g>
<path id="spark" d="M0,-10 C1.5,-3 3,-1.5 10,0 C3,1.5 1.5,3 0,10 C-1.5,3 -3,1.5 -10,0 C-3,-1.5 -1.5,-3 0,-10Z"/>
</defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
.rays{animation:spin 44s linear infinite}
.fly1{animation:fly1 2.8s ease-in-out infinite}
.fly2{animation:fly2 3.2s ease-in-out infinite .5s}
.pk1{animation:peek 2.4s ease-in-out infinite}
.pk2{animation:peek 2.4s ease-in-out infinite 1.2s}
.pk3{animation:peek2 3s ease-in-out infinite .6s}
.tw{animation:tw 2.4s ease-in-out infinite}
.tw2{animation-delay:.8s}.tw3{animation-delay:1.5s}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.trail{animation:trail 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly1{0%,100%{transform:translate(0,0) rotate(-7deg)}50%{transform:translate(-7px,15px) rotate(5deg)}}
@keyframes fly2{0%,100%{transform:translate(0,0) rotate(9deg)}50%{transform:translate(-5px,13px) rotate(-3deg)}}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes peek2{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.35}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes trail{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="460" fill="url(#bg)"/>
<g class="a rays" opacity=".42">
<g transform="translate(200,170)" fill="#feffe6">
<path d="M0,0 L-26,-340 L26,-340Z"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(45)"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(90)"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(135)"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(180)"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(225)"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(270)"/><path d="M0,0 L-26,-340 L26,-340Z" transform="rotate(315)"/>
</g></g>
<circle cx="200" cy="170" r="104" fill="#feffe6" opacity=".5"/>
<circle cx="352" cy="64" r="46" fill="#feffe6" opacity=".28"/>
<circle cx="30" cy="250" r="34" fill="#feffe6" opacity=".25"/>
<path d="M0,352 Q200,318 400,352 L400,460 L0,460Z" fill="url(#floor)"/>
<path d="M0,352 Q200,318 400,352" fill="none" stroke="#c9ef74" stroke-width="4" opacity=".7"/>
<circle cx="36" cy="438" r="56" fill="#a8de55" opacity=".35"/>
<ellipse cx="114" cy="418" rx="78" ry="14" fill="#2f7a16" opacity=".28"/>
<ellipse cx="288" cy="418" rx="78" ry="14" fill="#2f7a16" opacity=".28"/>
<!-- motion trails -->
<g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 15" opacity=".9">
<path class="trail" d="M166,160 Q124,180 116,236"/>
<path class="trail" d="M320,186 Q304,214 296,244"/>
</g>
<!-- red basket -->
<g transform="translate(114,308)">
<circle cx="-64" cy="34" r="17" fill="none" stroke="#b92c33" stroke-width="10"/><circle cx="64" cy="34" r="17" fill="none" stroke="#b92c33" stroke-width="10"/>
<ellipse cx="0" cy="0" rx="68" ry="15" fill="#7d1a26"/>
<g transform="translate(-30,-22)"><g class="a pk1">
<use xlink:href="#heart" y="5" fill="#c22e36" stroke="#c22e36" stroke-width="7" stroke-linejoin="round" transform="scale(.82)"/>
<use xlink:href="#heart" fill="url(#gRed)" stroke="url(#gRed)" stroke-width="7" stroke-linejoin="round" transform="scale(.82)"/>
<path d="M-19,-12 Q-17,-20 -10,-21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
<use xlink:href="#face" y="-5" transform="scale(.74)"/>
</g></g>
<g transform="translate(33,-24)"><g class="a pk2">
<rect x="-27" y="-21" width="54" height="54" rx="14" fill="#c22e36"/>
<rect x="-27" y="-27" width="54" height="54" rx="14" fill="url(#gRed)"/>
<path d="M-18,-10 Q-18,-19 -9,-19" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
<use xlink:href="#face" y="1" transform="scale(.8)"/>
</g></g>
<use xlink:href="#body" fill="url(#gRed)"/>
<path d="M-52,36 L52,36 M-48,64 L48,64" stroke="#ffb1a6" stroke-width="7" stroke-linecap="round" opacity=".45"/>
<path d="M-56,14 L-49,86" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".22"/>
<rect x="-74" y="-8" width="148" height="26" rx="13" fill="#c22e36" opacity=".45"/>
<rect x="-74" y="-13" width="148" height="26" rx="13" fill="url(#rimR)"/>
<rect x="-62" y="-9" width="124" height="6" rx="3" fill="#fff" opacity=".6"/>
<circle cx="0" cy="62" r="29" fill="#a8232c" opacity=".35"/><circle cx="0" cy="59" r="29" fill="#fff"/>
<use xlink:href="#splash" y="59" fill="#ee4a47"/><circle cx="20" cy="46" r="3" fill="#ee4a47"/><circle cx="-19" cy="74" r="3.4" fill="#ee4a47"/>
</g>
<!-- blue basket -->
<g transform="translate(288,308)">
<circle cx="-64" cy="34" r="17" fill="none" stroke="#2460c4" stroke-width="10"/><circle cx="64" cy="34" r="17" fill="none" stroke="#2460c4" stroke-width="10"/>
<ellipse cx="0" cy="0" rx="68" ry="15" fill="#163c82"/>
<g transform="translate(-31,-25)"><g class="a pk2">
<circle cy="6" r="29" fill="#2460c4"/><circle r="29" fill="url(#gBlue)"/>
<path d="M-19,-10 Q-16,-19 -7,-22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
<use xlink:href="#face" y="2" transform="scale(.8)"/>
</g></g>
<g transform="translate(32,-27)"><g class="a pk3">
<use xlink:href="#star" y="5" fill="#2460c4" stroke="#2460c4" stroke-width="12" stroke-linejoin="round" transform="scale(.62)"/>
<use xlink:href="#star" fill="url(#gBlue)" stroke="url(#gBlue)" stroke-width="12" stroke-linejoin="round" transform="scale(.62)"/>
<path d="M-10,-17 L-5,-27" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".65"/>
<use xlink:href="#face" y="2" transform="scale(.7)"/>
</g></g>
<use xlink:href="#body" fill="url(#gBlue)"/>
<path d="M-52,36 L52,36 M-48,64 L48,64" stroke="#a9d6ff" stroke-width="7" stroke-linecap="round" opacity=".45"/>
<path d="M-56,14 L-49,86" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".22"/>
<rect x="-74" y="-8" width="148" height="26" rx="13" fill="#2460c4" opacity=".45"/>
<rect x="-74" y="-13" width="148" height="26" rx="13" fill="url(#rimB)"/>
<rect x="-62" y="-9" width="124" height="6" rx="3" fill="#fff" opacity=".6"/>
<circle cx="0" cy="62" r="29" fill="#1c4fa8" opacity=".35"/><circle cx="0" cy="59" r="29" fill="#fff"/>
<use xlink:href="#splash" y="59" fill="#3a86f0"/><circle cx="20" cy="46" r="3" fill="#3a86f0"/><circle cx="-19" cy="74" r="3.4" fill="#3a86f0"/>
</g>
<!-- sparkles -->
<g fill="#fff">
<g transform="translate(84,96)"><use class="a tw" xlink:href="#spark"/></g>
<g transform="translate(262,70) scale(.8)"><use class="a tw tw2" xlink:href="#spark"/></g>
<g transform="translate(204,238) scale(.75)"><use class="a tw tw3" xlink:href="#spark"/></g>
<g transform="translate(368,236) scale(.6)"><use class="a tw tw2" xlink:href="#spark"/></g>
<g transform="translate(40,330) scale(.55)"><use class="a tw tw3" xlink:href="#spark"/></g>
</g>
<!-- hero: red ball hopping to the red basket -->
<g transform="translate(196,116)"><g class="a fly1">
<circle cy="9" r="56" fill="#c22e36"/>
<circle r="56" fill="url(#gRed)"/>
<path d="M-38,-20 Q-32,-38 -14,-44" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".6"/>
<use xlink:href="#face" y="4" transform="scale(1.5)"/>
</g></g>
<!-- blue heart on its way to the blue basket -->
<g transform="translate(330,150)"><g class="a fly2">
<use xlink:href="#heart" y="6" fill="#2460c4" stroke="#2460c4" stroke-width="8" stroke-linejoin="round"/>
<use xlink:href="#heart" fill="url(#gBlue)" stroke="url(#gBlue)" stroke-width="8" stroke-linejoin="round"/>
<path d="M-24,-14 Q-22,-24 -13,-25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<use xlink:href="#face" y="-4" transform="scale(.9)"/>
</g></g>
</svg>
