<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#ede7f6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Toy sorter box: white lid with holes, pink front with a window -->
  <ellipse cx="146" cy="168" rx="104" ry="8" fill="#9c4dcc" opacity="0.14"/>
  <path d="M42 108 H250 V150 Q250 164 236 164 H56 Q42 164 42 150 Z" fill="#e57fa4"/>
  <path d="M42 108 H250 V146 Q250 160 236 160 H56 Q42 160 42 146 Z" fill="#f48fb1"/>
  <rect x="58" y="116" width="176" height="38" rx="11" fill="#f9c4d6"/>
  <rect x="62" y="120" width="168" height="30" rx="9" fill="#7d4a6a"/>
  <!-- pieces already inside, seen through the window -->
  <g transform="translate(94 140) rotate(-8)">
    <circle r="10" fill="#ef5350"/>
    <circle cx="-3" cy="-1" r="1.4" fill="#3a1060"/><circle cx="3" cy="-1" r="1.4" fill="#3a1060"/>
  </g>
  <g transform="translate(124 141) rotate(6)">
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#42a5f5"/>
    <circle cx="-3" cy="-1" r="1.4" fill="#3a1060"/><circle cx="3" cy="-1" r="1.4" fill="#3a1060"/>
  </g>
  <path d="M76 150 L90 120 H100 L86 150 Z" fill="#ffffff" opacity="0.16"/>
  <rect x="62" y="120" width="168" height="30" rx="9" fill="none" stroke="#fde3ec" stroke-width="2"/>
  <!-- lid lip + top face (seen from above) -->
  <path d="M58 30 H234 Q246 30 248 42 L254 104 Q255 114 244 114 H48 Q37 114 38 104 L44 42 Q46 30 58 30 Z" fill="#f9bcd1"/>
  <path d="M58 24 H234 Q246 24 248 36 L254 98 Q255 108 244 108 H48 Q37 108 38 98 L44 36 Q46 24 58 24 Z"
        fill="#fffafd" stroke="#f6a5c0" stroke-width="2.5"/>
  <!-- circle hole (done) -->
  <circle cx="88" cy="66" r="24" fill="#ef5350"/>
  <circle cx="88" cy="66" r="20" fill="#d84a47"/>
  <path d="M80 66 L86 72 L97 60" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- moon hole -->
  <path d="M164 46 A22 22 0 1 0 170 84 A17 17 0 1 1 164 46 Z" fill="#9575cd" opacity="0.7"
        transform="translate(-6 0)"/>
  <path d="M163 50 A18 18 0 1 0 168 81 A14 14 0 1 1 163 50 Z" fill="#3c2560" transform="translate(-6 0)"/>
  <!-- star hole, glowing: the star is about to drop in -->
  <path d="M206 38 L214.5 55.5 L233.5 58 L219.5 71 L223 90 L206 81 L189 90 L192.5 71 L178.5 58 L197.5 55.5 Z"
        fill="#ffca28" opacity="0.55"/>
  <path d="M206 44 L212.5 57.5 L227 59.5 L216.5 69.5 L219 84 L206 77 L193 84 L195.5 69.5 L185 59.5 L199.5 57.5 Z"
        fill="#3e2a4e"/>

  <!-- Star piece hovering over its hole -->
  <g transform="translate(270 54) rotate(12)">
    <path d="M0 -30 L8.8 -12 L28.5 -9.3 L14.3 4.5 L17.6 24.3 L0 15 L-17.6 24.3 L-14.3 4.5 L-28.5 -9.3 L-8.8 -12 Z"
          fill="#f2b51e" transform="translate(0 3)"/>
    <path d="M0 -30 L8.8 -12 L28.5 -9.3 L14.3 4.5 L17.6 24.3 L0 15 L-17.6 24.3 L-14.3 4.5 L-28.5 -9.3 L-8.8 -12 Z"
          fill="#ffca28"/>
    <ellipse cx="-5" cy="-12" rx="5" ry="2.6" fill="#fff" opacity="0.4"/>
    <circle cx="-6" cy="0" r="2.6" fill="#3a1060"/>
    <circle cx="6" cy="0" r="2.6" fill="#3a1060"/>
    <path d="M-4.5 6 Q0 10 4.5 6" fill="none" stroke="#3a1060" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M248 88 Q236 80 230 70" fill="none" stroke="#ce93d8" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round"/>
  <!-- Diamond piece waiting -->
  <g transform="translate(286 132)">
    <path d="M0 -22 L16 0 L0 22 L-16 0 Z" fill="#e88a2c" transform="translate(0 3)" stroke-linejoin="round"/>
    <path d="M0 -22 L16 0 L0 22 L-16 0 Z" fill="#ffa040" stroke="#ffa040" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-4.5" cy="-1" r="2" fill="#3a1060"/>
    <circle cx="4.5" cy="-1" r="2" fill="#3a1060"/>
    <path d="M-3.5 4 Q0 7 3.5 4" fill="none" stroke="#3a1060" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="18" y="34" font-size="18">✨</text>
</svg>
