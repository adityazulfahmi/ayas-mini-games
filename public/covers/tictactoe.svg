<style>
.hop,.wig,.tw,.pulse,.glow,.bob,.bob2,.blink,.ear,.drift{transform-box:fill-box;transform-origin:center}
.hop{animation:hop 2.8s ease-in-out infinite}
.wig{animation:wig 3.2s ease-in-out infinite}
.tw{animation:tw 2.6s ease-in-out infinite}
.glow{animation:glow 2.8s ease-in-out infinite}
.bob{animation:bob 3.4s ease-in-out infinite}
.bob2{animation:bob 3.8s ease-in-out -1.5s infinite}
.blink{animation:blink 4.2s ease-in-out infinite}
.ear{transform-origin:50% 100%;animation:ear 3.4s ease-in-out infinite}
.ear.e2{animation-name:ear2}
.drift{animation:drift 7s ease-in-out infinite}
.pulse{animation:pulse 2.8s ease-in-out .4s infinite}
.shine{animation:shine 2.8s linear infinite}
@keyframes hop{0%,38%,100%{transform:translateY(0) scale(1)}16%{transform:translateY(-8px) scale(1.07)}28%{transform:translateY(1px) scale(.98,.96)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.45) rotate(40deg);opacity:.35}}
@keyframes glow{0%,45%,100%{opacity:.15}18%{opacity:.85}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ear{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-9deg)}82%{transform:rotate(4deg)}}
@keyframes ear2{0%,64%,100%{transform:rotate(0)}74%{transform:rotate(9deg)}86%{transform:rotate(-4deg)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes pulse{0%,40%,100%{transform:scale(1) rotate(0)}18%{transform:scale(1.28) rotate(14deg)}}
@keyframes shine{to{stroke-dashoffset:-60}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
