<circle cx="60" cy="250" r="7" fill="#ffb52e"/><path d="M56 255l-3 18h14l-3-18z" fill="#ffcf5a"/>
</g>
</defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
.wo{animation:wo 9s ease-in-out infinite}
.wi{animation:wi 9s ease-in-out infinite}
@keyframes wo{0%,10%{transform:translateX(0)}30%,50%{transform:translateX(112px)}72%,84%{transform:translateX(-112px)}100%{transform:translateX(0)}}
@keyframes wi{0%,10%{transform:translateX(0)}30%,50%{transform:translateX(-112px)}72%,84%{transform:translateX(112px)}100%{transform:translateX(0)}}
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45) rotate(30deg);opacity:.35}}
.bl{animation:bl 4.5s ease-in-out infinite}
@keyframes bl{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.q{animation:q 3s ease-in-out infinite}
@keyframes q{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
.lt{animation:lt 4s ease-in-out infinite}
@keyframes lt{0%,100%{opacity:1}50%{opacity:.72}}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sw 6s ease-in-out infinite}
@keyframes sw{0%,100%{transform:skewX(0)}50%{transform:skewX(1.6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
