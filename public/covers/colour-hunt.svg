<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 460">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0" stop-color="#ff5d5d"/><stop offset=".55" stop-color="#ff6f86"/><stop offset="1" stop-color="#ff9ebd"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="lens" cx=".42" cy=".36" r=".75">
<stop offset="0" stop-color="#fffdf2"/><stop offset=".7" stop-color="#fff1b8"/><stop offset="1" stop-color="#ffdf8a"/>
</radialGradient>
<radialGradient id="grape" cx=".36" cy=".3" r=".8">
<stop offset="0" stop-color="#c88bf2"/><stop offset=".55" stop-color="#9447d6"/><stop offset="1" stop-color="#6a1b9a"/>
</radialGradient>
<linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8e35c4"/><stop offset=".5" stop-color="#7a25b0"/><stop offset="1" stop-color="#55127f"/>
</linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe3ee"/>
</linearGradient>
<clipPath id="lc"><circle cx="225" cy="190" r="92"/></clipPath>
<g id="splat">
<path d="M0-40c8-1 11-9 19-9s11 9 8 16c-2 6 3 10 10 9 9-2 17 3 17 12s-9 12-15 13c-6 1-8 7-4 12 5 7 3 16-5 19s-14-3-18-8c-4-5-10-4-13 1-4 8-13 11-20 6s-6-13-2-19c3-5 0-10-6-11-8-1-15-7-13-16s11-11 18-9c6 2 11-2 10-8-1-8 5-8 14-8z"/>
<circle cx="52" cy="-34" r="7"/><circle cx="-50" cy="-30" r="5"/><circle cx="-44" cy="44" r="6"/><circle cx="46" cy="42" r="4.5"/><circle cx="6" cy="-62" r="4"/>
</g>
<path id="star" d="M0-12C1.500-3 3-1.500 12 0 3 1.500 1.500 3 0 12-1.500 3-3 1.500-12 0-3-1.500-1.500-3 0-12z"/>
</defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
.glass{transform-box:view-box;transform-origin:225px 190px;animation:sway 5s ease-in-out infinite}
.grapes{animation:bob 2.6s ease-in-out infinite}
.sp{animation:pulse 4s ease-in-out infinite}
.tw{animation:tw 2.4s ease-in-out infinite}
.eye{animation:blink 4.5s infinite}
.glint{animation:glint 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(-5px,2px) rotate(-3deg)}50%{transform:translate(5px,-4px) rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(4deg)}}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45) rotate(45deg);opacity:.5}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glint{0%,100%{opacity:.95}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="460" fill="url(#bg)"/>
<circle cx="330" cy="40" r="150" fill="#ff8a7a" opacity=".35"/>
<circle cx="40" cy="440" r="170" fill="#ffc0d6" opacity=".35"/>
<circle cx="225" cy="190" r="190" fill="url(#glow)"/>

<!-- paint splats -->
<g transform="translate(62 150)"><g class="a sp"><use xlink:href="#splat" href="#splat" fill="#ffd23f" transform="scale(1.05) rotate(12)"/><ellipse cx="-12" cy="-16" rx="13" ry="7" fill="#fff" opacity=".6" transform="rotate(-25 -12 -16)"/></g></g>
<g transform="translate(338 78)"><g class="a sp" style="animation-delay:-1s"><use xlink:href="#splat" href="#splat" fill="#3fa9f5" transform="scale(.95) rotate(-40)"/><ellipse cx="-10" cy="-14" rx="12" ry="6.500" fill="#fff" opacity=".55" transform="rotate(-25 -10 -14)"/></g></g>
<g transform="translate(338 318)"><g class="a sp" style="animation-delay:-2s"><use xlink:href="#splat" href="#splat" fill="#4ccb6a" transform="scale(1.1) rotate(70)"/><ellipse cx="-12" cy="-16" rx="13" ry="7" fill="#fff" opacity=".55" transform="rotate(-25 -12 -16)"/></g></g>
<g transform="translate(52 318)"><g class="a sp" style="animation-delay:-3s"><use xlink:href="#splat" href="#splat" fill="#ff9a2e" transform="scale(.8) rotate(150)"/><ellipse cx="-9" cy="-12" rx="10" ry="5.500" fill="#fff" opacity=".55" transform="rotate(-25 -9 -12)"/></g></g>
<g transform="translate(232 408)"><g class="a sp" style="animation-delay:-1.5s"><use xlink:href="#splat" href="#splat" fill="#b06be8" transform="scale(.72) rotate(200)"/><ellipse cx="-8" cy="-11" rx="9" ry="5" fill="#fff" opacity=".55" transform="rotate(-25 -8 -11)"/></g></g>
<g transform="translate(150 52)"><g class="a sp" style="animation-delay:-2.5s"><use xlink:href="#splat" href="#splat" fill="#fff" opacity=".9" transform="scale(.42) rotate(95)"/></g></g>

<!-- magnifying glass -->
<g class="glass">
<!-- shadow -->
<g transform="translate(8 14)" fill="#b3123f" opacity=".22">
<circle cx="225" cy="190" r="106"/>
<rect x="203" y="290" width="44" height="130" rx="22" transform="rotate(35 225 190)"/>
</g>
<!-- handle -->
<g transform="rotate(35 225 190)">
<rect x="212" y="286" width="26" height="30" fill="#ffd23f"/>
<rect x="212" y="286" width="9" height="30" fill="#fff" opacity=".45"/>
<rect x="203" y="306" width="44" height="116" rx="22" fill="url(#handle)"/>
<rect x="211" y="318" width="9" height="78" rx="4.500" fill="#fff" opacity=".35"/>
<rect x="203" y="322" width="44" height="12" fill="#f06292"/>
</g>
<!-- lens -->
<circle cx="225" cy="190" r="92" fill="url(#lens)"/>
<g clip-path="url(#lc)">
<use xlink:href="#splat" href="#splat" fill="#f1dcff" transform="translate(226 200) scale(1.55) rotate(20)"/>
<g transform="translate(225 192) scale(1.16) translate(-225 -186)"><g class="a grapes">
<path d="M225 150c-1-12 3-20 12-25" fill="none" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round"/>
<path d="M228 140c8-18 28-20 44-12-6 16-26 22-44 12z" fill="#4ccb6a"/>
<path d="M232 139c12-6 24-8 36-10" fill="none" stroke="#2f9e4c" stroke-width="2.500" stroke-linecap="round"/>
<g fill="url(#grape)">
<circle cx="225" cy="238" r="21"/>
<circle cx="205" cy="208" r="22"/><circle cx="245" cy="208" r="22"/>
<circle cx="185" cy="174" r="22"/><circle cx="265" cy="174" r="22"/><circle cx="225" cy="176" r="29"/>
</g>
<g fill="#fff" opacity=".7">
<ellipse cx="176" cy="164" rx="6" ry="4" transform="rotate(-35 176 164)"/><ellipse cx="256" cy="164" rx="6" ry="4" transform="rotate(-35 256 164)"/>
<ellipse cx="211" cy="159" rx="8" ry="4.500" transform="rotate(-35 211 159)"/><ellipse cx="196" cy="198" rx="6" ry="4" transform="rotate(-35 196 198)"/>
<ellipse cx="236" cy="198" rx="6" ry="4" transform="rotate(-35 236 198)"/><ellipse cx="216" cy="229" rx="6" ry="4" transform="rotate(-35 216 229)"/>
</g>
<!-- face -->
<g class="a eye"><circle cx="214" cy="176" r="5" fill="#3a0f57"/><circle cx="236" cy="176" r="5" fill="#3a0f57"/><circle cx="215.700" cy="174.200" r="1.700" fill="#fff"/><circle cx="237.700" cy="174.200" r="1.700" fill="#fff"/></g>
<path d="M219 184q6 7 12 0" fill="none" stroke="#3a0f57" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="206" cy="185" rx="6" ry="4" fill="#ff7fb0" opacity=".85"/><ellipse cx="244" cy="185" rx="6" ry="4" fill="#ff7fb0" opacity=".85"/>
</g>
</g>
</g>
<!-- rim -->
<circle cx="225" cy="190" r="99" fill="none" stroke="#d9a441" stroke-width="3" opacity=".5"/>
<circle cx="225" cy="190" r="99" fill="none" stroke="url(#rim)" stroke-width="16"/>
<circle cx="225" cy="190" r="90" fill="none" stroke="#e8b54a" stroke-width="2.500" opacity=".55"/>
<path d="M150 190a75 75 0 0 1 48-70" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" class="glint"/>
<circle cx="214" cy="114" r="5" fill="#fff" class="glint"/>
</g>

<!-- sparkles -->
<g transform="translate(92 62)"><use xlink:href="#star" href="#star" fill="#fff" class="a tw" transform="scale(1.3)"/></g>
<g transform="translate(350 205)"><use xlink:href="#star" href="#star" fill="#fff" class="a tw" style="animation-delay:-.8s"/></g>
<g transform="translate(70 415)"><use xlink:href="#star" href="#star" fill="#fff" class="a tw" style="animation-delay:-1.6s" transform="scale(1.1)"/></g>
<g transform="translate(262 52)"><use xlink:href="#star" href="#star" fill="#fff3b0" class="a tw" style="animation-delay:-1.2s" transform="scale(.8)"/></g>
</svg>
