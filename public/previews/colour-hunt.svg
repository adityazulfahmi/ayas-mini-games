<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#ede7f6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Question card: purple paint splat + spoken prompt -->
  <rect x="16" y="22" width="122" height="136" rx="20" fill="#f3e5f5" stroke="#d1a3dc" stroke-width="2.5"/>
  <g transform="translate(77 72)">
    <circle cx="0" cy="3" r="30" fill="#6f1c85"/>
    <circle cx="-38" cy="-12" r="7" fill="#6f1c85"/><circle cx="-38" cy="-14" r="7" fill="#8e24aa"/>
    <circle cx="38" cy="16" r="8" fill="#6f1c85"/><circle cx="38" cy="14" r="8" fill="#8e24aa"/>
    <circle cx="0" cy="0" r="30" fill="#8e24aa"/>
    <ellipse cx="-10" cy="-13" rx="10" ry="5" fill="white" opacity="0.45"/>
  </g>
  <text x="77" y="138" font-family="Fredoka One, system-ui, sans-serif" font-size="17" fill="#721d88" text-anchor="middle">Find purple!</text>
  <circle cx="122" cy="38" r="11" fill="white" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="122" y="43" font-size="12" text-anchor="middle">🔊</text>

  <!-- Answer tiles -->
  <rect x="152" y="22" width="72" height="64" rx="15" fill="#e0f7fa" stroke="#80cbc4" stroke-width="3.5"/>
  <text x="188" y="66" font-size="36" text-anchor="middle">🍇</text>

  <rect x="232" y="22" width="72" height="64" rx="15" fill="white" stroke="#ce93d8" stroke-width="2.5" opacity="0.9"/>
  <text x="268" y="66" font-size="34" text-anchor="middle" opacity="0.7">🍌</text>

  <rect x="152" y="94" width="72" height="64" rx="15" fill="white" stroke="#ce93d8" stroke-width="2.5" opacity="0.9"/>
  <text x="188" y="138" font-size="34" text-anchor="middle" opacity="0.7">🐸</text>

  <rect x="232" y="94" width="72" height="64" rx="15" fill="white" stroke="#ce93d8" stroke-width="2.5" opacity="0.9"/>
  <text x="268" y="138" font-size="34" text-anchor="middle" opacity="0.7">🚒</text>

  <!-- Sparkles around the found grapes -->
  <text x="146" y="28" font-size="13">✨</text>
  <text x="214" y="96" font-size="11">⭐</text>
  <text x="140" y="174" font-size="10" fill="#9c4dcc" opacity="0.7">✨</text>
</svg>
