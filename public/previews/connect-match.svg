<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#ede7f6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Matched line: dog (top-left knob) to bone (bottom-right knob), teal -->
  <line x1="104" y1="50" x2="216" y2="130" stroke="#4db6ac" stroke-width="8" stroke-linecap="round"/>
  <line x1="104" y1="50" x2="216" y2="130" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- In-progress line: bunny knob toward carrot, pink, with a finger -->
  <line x1="104" y1="130" x2="184" y2="73" stroke="#f06292" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="104" y1="130" x2="184" y2="73" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="184" cy="73" r="8" fill="#f06292"/>
  <circle cx="184" cy="73" r="3" fill="white"/>

  <!-- Left: dog (matched) -->
  <rect x="34" y="18" width="70" height="64" rx="16" fill="#9c4dcc" opacity="0.08" transform="translate(2 4)"/>
  <rect x="34" y="18" width="70" height="64" rx="16" fill="#e0f7fa" stroke="#4db6ac" stroke-width="3.5"/>
  <text x="69" y="62" font-size="36" text-anchor="middle">🐶</text>
  <text x="46" y="34" font-size="12" text-anchor="middle">💖</text>
  <circle cx="104" cy="50" r="9" fill="white"/><circle cx="104" cy="50" r="6" fill="#4db6ac"/>

  <!-- Left: bunny (selected) -->
  <rect x="34" y="98" width="70" height="64" rx="16" fill="#9c4dcc" opacity="0.12" transform="translate(2 4)"/>
  <rect x="34" y="98" width="70" height="64" rx="16" fill="#fce4ec" stroke="#f06292" stroke-width="4"/>
  <text x="69" y="142" font-size="36" text-anchor="middle">🐰</text>
  <circle cx="104" cy="130" r="9" fill="white"/><circle cx="104" cy="130" r="6" fill="#f06292"/>

  <!-- Right: carrot (target, highlighted) -->
  <rect x="216" y="18" width="70" height="64" rx="16" fill="#9c4dcc" opacity="0.12" transform="translate(2 4)"/>
  <rect x="216" y="18" width="70" height="64" rx="16" fill="#fff0f6" stroke="#f06292" stroke-width="3"/>
  <text x="251" y="62" font-size="36" text-anchor="middle">🥕</text>
  <circle cx="216" cy="50" r="9" fill="white"/><circle cx="216" cy="50" r="6" fill="#ce93d8"/>

  <!-- Right: bone (matched) -->
  <rect x="216" y="98" width="70" height="64" rx="16" fill="#9c4dcc" opacity="0.08" transform="translate(2 4)"/>
  <rect x="216" y="98" width="70" height="64" rx="16" fill="#e0f7fa" stroke="#4db6ac" stroke-width="3.5"/>
  <text x="251" y="142" font-size="34" text-anchor="middle">🦴</text>
  <text x="274" y="114" font-size="12" text-anchor="middle">💖</text>
  <circle cx="216" cy="130" r="9" fill="white"/><circle cx="216" cy="130" r="6" fill="#4db6ac"/>

  <!-- Finger guiding the pink line -->
  <text x="190" y="104" font-size="24" text-anchor="middle">👆</text>
</svg>
