<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#ede7f6"/>
    </linearGradient>
    <radialGradient id="ooo-spot" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#80cbc4" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#80cbc4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Spoken prompt bubble -->
  <rect x="14" y="12" width="292" height="40" rx="20" fill="white" stroke="#ce93d8" stroke-width="1.5" filter="drop-shadow(0 3px 6px rgba(156,77,204,0.12))"/>
  <circle cx="36" cy="32" r="14" fill="#f06292"/>
  <path d="M28.5 28.5 h4 l5.5 -4.5 v16 l-5.5 -4.5 h-4 z" fill="white"/>
  <path d="M41 27.5 q3.5 4.5 0 9" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <text x="58" y="37.5" font-family="Fredoka One, system-ui, sans-serif" font-size="15" fill="#6a1b9a">Which one is not an animal?</text>

  <!-- 2x2 grid: three animals and an apple -->
  <g filter="drop-shadow(0 3px 6px rgba(156,77,204,0.13))">
    <rect x="62"  y="60" width="94" height="50" rx="14" fill="white" stroke="#ce93d8" stroke-width="2"/>
    <rect x="164" y="60" width="94" height="50" rx="14" fill="white" stroke="#ce93d8" stroke-width="2"/>
    <rect x="62"  y="116" width="94" height="50" rx="14" fill="white" stroke="#ce93d8" stroke-width="2"/>
  </g>
  <text x="109" y="96" font-size="32" text-anchor="middle">🐱</text>
  <text x="211" y="96" font-size="32" text-anchor="middle">🐶</text>
  <text x="109" y="152" font-size="32" text-anchor="middle">🐰</text>

  <!-- The odd one -->
  <ellipse cx="211" cy="141" rx="70" ry="36" fill="url(#ooo-spot)"/>
  <rect x="164" y="116" width="94" height="50" rx="14" fill="#e0f7fa" stroke="#80cbc4" stroke-width="3.5" filter="drop-shadow(0 4px 8px rgba(128,203,196,0.35))"/>
  <text x="211" y="153" font-size="33" text-anchor="middle">🍎</text>
  <text x="250" y="170" font-size="20" text-anchor="middle">👆</text>

  <text x="30"  y="112" font-size="14" opacity="0.85">✨</text>
  <text x="272" y="140" font-size="14" opacity="0.85">✨</text>
  <text x="280" y="98" font-size="12" opacity="0.7">💖</text>
</svg>
