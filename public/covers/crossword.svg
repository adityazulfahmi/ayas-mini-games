<g class="a head">
<path d="M177 94L193 36 226 64ZM291 94L275 36 242 64Z" fill="#ff9d3a" stroke="#ff9d3a" stroke-width="9" stroke-linejoin="round"/>
<path d="M189 80L196 50 212 66ZM279 80L272 50 256 66Z" fill="#ff8fb0" stroke="#ff8fb0" stroke-width="5" stroke-linejoin="round"/>
<ellipse cx="234" cy="116" rx="70" ry="58" fill="url(#fur)"/>
<path d="M234 60v17M218 63l3 13M250 63l-3 13" stroke="#e87a1e" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="234" cy="140" rx="34" ry="24" fill="#fff3dc"/>
<ellipse cx="190" cy="134" rx="11" ry="7" fill="#ff7fa3" opacity=".7"/><ellipse cx="278" cy="134" rx="11" ry="7" fill="#ff7fa3" opacity=".7"/>
<g class="a eye"><ellipse cx="207" cy="114" rx="8.5" ry="10" fill="#3a2350"/><circle cx="210" cy="110" r="3.2" fill="#fff"/></g>
<g class="a eye"><ellipse cx="261" cy="114" rx="8.5" ry="10" fill="#3a2350"/><circle cx="264" cy="110" r="3.2" fill="#fff"/></g>
<path d="M228 127h12l-6 7z" fill="#f06292" stroke="#f06292" stroke-width="3" stroke-linejoin="round"/>
<path d="M234 135v5m-10 2q5 6 10-2 5 8 10 2" fill="none" stroke="#3a2350" stroke-width="2.8" stroke-linecap="round"/>
<path d="M176 118l-22-5M177 127l-22 4M292 118l22-5M291 127l22 4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>
</g>
<g transform="translate(74 160)"><g class="a hop"><use xlink:href="#tp"/><use xlink:href="#lc" y="3" fill="none" stroke="#b91c63" stroke-width="11" stroke-linecap="round"/><use xlink:href="#lc" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/></g></g>
<g transform="translate(158 244)"><g class="a hop h4"><use xlink:href="#tp"/><g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#ly" y="3" stroke="#b91c63"/><use xlink:href="#ly" stroke="#fff"/></g></g></g>
<g transform="translate(158 328)"><g class="a hop h5"><use xlink:href="#ty"/><g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#la" y="3" stroke="#fff" opacity=".7"/><use xlink:href="#la" stroke="#6a1b9a"/></g></g></g>
<g transform="translate(158 160)"><g class="a hop h2"><use xlink:href="#ty"/><g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#la" y="3" stroke="#fff" opacity=".7"/><use xlink:href="#la" stroke="#6a1b9a"/></g><use xlink:href="#paw" x="42" y="1"/></g></g>
<g transform="translate(242 160)"><g class="a hop h3"><use xlink:href="#tp"/><g fill="none" stroke-width="11" stroke-linecap="round"><use xlink:href="#lt" y="3" stroke="#b91c63"/><use xlink:href="#lt" stroke="#fff"/></g><use xlink:href="#paw" x="36" y="1"/></g></g>
</g>
<g fill="#fff"><g transform="translate(350 110)"><use class="a tw" xlink:href="#sp"/></g><g transform="translate(46 236) scale(.8)"><use class="a tw t2" xlink:href="#sp"/></g><g transform="translate(318 350) scale(1.1)"><use class="a tw t3" xlink:href="#sp" fill="#ffe066"/></g><g transform="translate(52 150) scale(.9)"><use class="a tw t4" xlink:href="#sp" fill="#ffb3cf"/></g><circle cx="120" cy="52" r="3.5" opacity=".8"/><circle cx="356" cy="180" r="3" opacity=".8"/><circle cx="112" cy="372" r="3" opacity=".8"/></g>
</svg>
