<circle cx="178" cy="215" r="2.8" fill="#fff"/><circle cx="228" cy="215" r="2.8" fill="#fff"/>
<path d="M194 233q6-4 12 0q-2 7-6 7q-4 0-6-7z" fill="#f06292"/>
<path d="M200 240q-2 9-12 6M200 240q2 9 12 6" fill="none" stroke="#3a1250" stroke-width="2.6" stroke-linecap="round"/>
<ellipse cx="172" cy="188" rx="22" ry="9" transform="rotate(-20 172 188)" fill="#fff" opacity=".8"/>
</g></g>
<!-- magic shine on the wipe edge -->
<g clip-path="url(#bun)"><g class="wo"><rect x="191" y="60" width="18" height="340" fill="url(#shine)"/></g></g>
<g class="wo"><g transform="translate(200 104)"><use class="a tw" xlink:href="#star" href="#star" transform="scale(1.9)" fill="#fff6c8"/></g></g>
<!-- curtains -->
<g class="sw"><use xlink:href="#curtain" href="#curtain"/></g>
<g transform="translate(400 0) scale(-1 1)"><g class="sw" style="animation-delay:-3s"><use xlink:href="#curtain" href="#curtain"/></g></g>
<path d="M0 0H400V38q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0Z" fill="url(#val)"/>
<path d="M400 38q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0q-25 34-50 0" fill="none" stroke="#ffcf5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
